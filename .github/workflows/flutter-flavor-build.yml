name: Flutter Build on Merge to Main

on:
  push:
    branches:
      - main

jobs:
  build-user-flavor:
    name: Build Flutter User Flavor
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Decode google-services.json to correct flavor folder
        run: |
          mkdir -p android/app/src/user
          echo "${{ secrets.GOOGLE_SERVICES_USER_JSON }}" | base64 -d > android/app/src/user/google-services.json

      - name: Build APK for User Flavor
        run: flutter build apk --flavor user -t lib/main_user.dart
      
      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: user-apk
          path: build/app/outputs/flutter-apk/app-user-release.apk

  build-admin-flavor:
    name: Build Flutter Admin Flavor
    runs-on: ubuntu-latest
    needs: build-user-flavor
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Decode google-services.json to correct flavor folder
        run: |
          mkdir -p android/app/src/user
          echo "${{ secrets.GOOGLE_SERVICES_ADMIN_JSON }}" | base64 -d > android/app/src/admin/google-services.json

      - name: Build APK for Admin Flavor
        run: flutter build apk --flavor admin -t lib/main_admin.dart

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-apk
          path: build/app/outputs/flutter-apk/app-admin-release.apk

  
  release:
    name: Release APKs to GitHub
    runs-on: ubuntu-latest
    needs:
      - build-user-flavor
      - build-admin-flavor
    
    steps:
      - uses: actions/checkout@v4

      - name: Download User APK
        uses: actions/download-artifact@v4
        with:
          name: user-apk
          path: dist

      - name: Download Admin APK
        uses: actions/download-artifact@v4
        with:
          name: admin-apk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.run_number }}
          tag_name: v1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/app-user-release.apk
            dist/app-admin-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}